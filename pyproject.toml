[project]
name = "sentinel"
version = "0.1.0"
description = "Intelligent DevSecOps Sentinel — pipeline analítico de segurança com detecção baseada em regras e ML"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Sergio Santos", email = "santossergiorealbjj@outlook.com" }]
# Python 3.15 padronizado localmente e no CI do GitHub Actions.
requires-python = ">=3.15"
keywords = ["security", "devsecops", "anomaly-detection", "fastapi", "mlops"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.15",
    "Topic :: Security",
]

dependencies = [
    "fastapi>=0.143.1",
    "uvicorn[standard]>=0.54.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.15.0",
    "pandas>=3.0.6",
    "numpy>=2.5.4",
    "scikit-learn>=1.9.1",
    "joblib>=1.6.0",
    "python-dotenv>=1.2.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "httpx>=0.28.1",
    "ruff>=0.17.0",
    "mypy>=2.4.0",
    "bandit[toml]>=1.9.4",
    "pandas-stubs>=3.0.5.260914",
    "pip-audit>=2.10.1",
]  

mcp = ["mcp>=1.9.0"]

[project.urls]
Repository = "https://github.com/Santosdevbjj/geo-explorer-com-ibm-bob"
Issues     = "https://github.com/Santosdevbjj/geo-explorer-com-ibm-bob/issues"

# ── Ruff ────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py315"
line-length = 88
src = ["src", "api", "scripts", "tests", "mcp"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "TID"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["sentinel"]

# ── mypy ────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.15"
strict = true
ignore_missing_imports = true
exclude = ["notebooks/", "docs/"]

# ── pytest ──────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v --cov=src/sentinel --cov-report=term-missing --cov-report=html"

# ── bandit ──────────────────────────────────────────────────────────────────
[tool.bandit]
targets    = ["src", "api", "scripts", "mcp"]
skips      = ["B101"]   # assert em testes é intencional
severity   = "medium"

# ── build ────────────────────────────────────────────────────────────────────
[build-system]
requires      = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]